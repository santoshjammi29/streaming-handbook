name: CI Streaming Handbook Integrity & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run Integrity Test Suite
        run: |
          python scripts/run_tests.py

      - name: Verify CLI Explorer Execution
        run: |
          python scripts/interactive_shell.py --list
          python scripts/interactive_shell.py --modules
          python scripts/interactive_shell.py --ecosystem
